<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthAI - Healthcare Education Assistant</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f8fa;
    color:#24343b;
    font-family:Arial,sans-serif;
}

header{
    background:#167d8d;
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0 0 6px;
    font-size:28px;
}

header p{
    margin:0;
    font-size:13px;
}

.container{
    max-width:760px;
    margin:20px auto;
    padding:0 16px;
}

.card{
    background:white;
    border:1px solid #d8e5e8;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(20,60,70,.06);
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:100px;
    padding:12px;
    border:1px solid #d8e5e8;
    border-radius:10px;
    resize:vertical;
    font-size:14px;
    font-family:Arial,sans-serif;
}

textarea:focus{
    outline:none;
    border-color:#167d8d;
}

.example{
    color:#60747c;
    font-size:11px;
    margin-top:6px;
}

.buttons{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:8px;
    margin-top:12px;
}

button{
    padding:11px 8px;
    border-radius:9px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#167d8d;
    color:white;
    border:0;
}

.primary:hover{
    background:#126673;
}

.secondary{
    background:white;
    color:#24343b;
    border:1px solid #d8e5e8;
}

.secondary:hover{
    background:#eef5f6;
}

.clear{
    width:100%;
    margin-top:8px;
}

.result h2{
    font-size:18px;
    margin-top:0;
}

.small{
    font-size:13px;
    line-height:1.55;
}

.match{
    border:1px solid #d8e5e8;
    border-radius:11px;
    padding:14px;
    margin:12px 0;
}

.match h3{
    margin:0 0 6px;
    font-size:16px;
}

.meta{
    color:#60747c;
    font-size:12px;
}

.bar{
    height:7px;
    background:#e7eff1;
    border-radius:10px;
    overflow:hidden;
    margin:8px 0;
}

.fill{
    height:100%;
    background:#167d8d;
}

.notice{
    background:#fff8e8;
    border-left:4px solid #d99b2b;
    padding:13px;
    border-radius:8px;
    font-size:13px;
}

.tip{
    background:#eef8f8;
    border-radius:8px;
    padding:10px;
}

.footer{
    text-align:center;
    color:#60747c;
    font-size:11px;
    padding-bottom:20px;
}

@media(max-width:600px){

    .buttons{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:24px;
    }
}
</style>
</head>


<body>

<header>

<h1>🩺 HealthAI</h1>

<p>
Healthcare Education Assistant
</p>

</header>


<main class="container">


<section class="card">

<label for="symptoms">
Enter your symptoms
</label>


<textarea
id="symptoms"
placeholder="Example: I have a headache and fever">
</textarea>


<div class="example">

You can enter one or several symptoms,
for example: headache, fever, cough

</div>


<div class="buttons">

<button
class="primary"
onclick="analyzeSymptoms()">

Analyze Symptoms

</button>


<button
class="secondary"
onclick="showTips()">

Health Tips

</button>


<button
class="secondary"
onclick="showCategories()">

Categories

</button>

</div>


<button
class="secondary clear"
onclick="clearApp()">

Clear

</button>

</section>



<section
class="card result"
id="result">

<h2>
Welcome to HealthAI
</h2>

<p class="small">

Enter one or more symptoms above to
explore educational health information.

</p>

</section>



<div class="footer">
    Educational prototype • Not medical advice
    <br>
    <strong>Developed by Maria Kareem Bux Channa</strong>

</div>


</main>

/* =========================
   SYMPTOM ALIASES
========================= */

const aliases = {

"head pain":"headache",
"head hurts":"headache",
"head ache":"headache",

"high temperature":"fever",
"temperature":"fever",

"backache":"back pain",
"lower backache":"lower back pain",

"stomach ache":"stomach pain",
"belly pain":"stomach pain",

"throwing up":"vomiting",
"throw up":"vomiting",

"loose motion":"diarrhea",
"loose motions":"diarrhea",

"breathlessness":"shortness of breath",
"breathing problem":"difficulty breathing",
"hard to breathe":"difficulty breathing",

"joint ache":"joint pain",
"joint aches":"joint pain",

"burning urine":"burning urination"

};



/* =========================
   EXTRACT SYMPTOMS
========================= */

function extractSymptoms(text){

    text=text.toLowerCase();

    let found=[];


    /* aliases first */

    for(const phrase in aliases){

        if(text.includes(phrase)){

            const symptom=aliases[phrase];

            if(!found.includes(symptom)){
                found.push(symptom);
            }
        }
    }


    /* database symptoms */

    let allSymptoms=[];


    for(const disease in healthData){

        allSymptoms.push(
            ...healthData[disease].symptoms
        );
    }


    allSymptoms=[
        ...new Set(allSymptoms)
    ];


    /* longer phrases first */

    allSymptoms.sort(
        (a,b)=>b.length-a.length
    );


    for(const symptom of allSymptoms){

        if(
            text.includes(symptom) &&
            !found.includes(symptom)
        ){

            found.push(symptom);
        }
    }


    return found;
}



/* =========================
   ANALYZE
========================= */

function analyzeSymptoms(){

    const input=
    document
    .getElementById("symptoms")
    .value
    .trim()
    .toLowerCase();


    const result=
    document
    .getElementById("result");


    /* empty */

    if(!input){

        result.innerHTML=`

        <h2>
        Please enter your symptoms
        </h2>

        <p class="small">

        Example:
        <b>headache and fever</b>

        </p>

        `;

        return;
    }


    /* emergency warning */

    const emergencyWords=[

        "severe chest pain",
        "chest pain and difficulty breathing",
        "severe difficulty breathing",
        "cannot breathe",
        "can't breathe",
        "unconscious",
        "fainting",
        "severe bleeding"

    ];


    for(const emergency of emergencyWords){

        if(input.includes(emergency)){

            result.innerHTML=`

            <div class="notice">

            <b>
            ⚠️ Urgent Medical Attention
            </b>

            <br><br>

            Your input contains a symptom
            that may require immediate medical care.

            <br><br>

            Please seek urgent medical attention.

            <br><br>

            This application cannot diagnose
            or manage medical emergencies.

            </div>

            `;

            return;
        }
    }


    const symptoms=
    extractSymptoms(input);


    /* no symptoms */

    if(symptoms.length===0){

        result.innerHTML=`

        <h2>
        No supported symptom detected
        </h2>

        <p class="small">

        Try entering symptoms such as:

        <br><br>

        <b>
        headache, fever, cough
        </b>

        <br>

        <b>
        back pain and stiffness
        </b>

        <br>

        <b>
        nausea and stomach pain
        </b>

        </p>

        `;

        return;
    }


    let results=[];


    /* calculate matches */

    for(const disease in healthData){

        const data=
        healthData[disease];


        const matched=
        symptoms.filter(
            symptom =>
            data.symptoms.includes(symptom)
        );


        if(matched.length>0){

            /*
             We calculate the percentage from
             the user's detected symptoms.
            */

            const percentage=
            Math.round(
                (matched.length/symptoms.length)*100
            );


            results.push({

                disease:disease,
                data:data,
                matched:matched,
                percentage:percentage

            });
        }
    }


    results.sort(
        (a,b)=>
        b.percentage-a.percentage
    );


    let html=`

    <h2>
    🔎 Possible Matches
    </h2>

    <p class="small">

    <b>
    Symptoms detected:
    </b>

    ${symptoms.join(", ")}

    </p>

    `;


    results
    .slice(0,6)
    .forEach(item=>{

        html+=`

        <div class="match">

        <h3>
        ${item.disease}
        </h3>

        <div class="meta">

        ${item.data.category}
        •
        ${item.percentage}% symptom match

        </div>


        <div class="bar">

        <div
        class="fill"
        style="width:${item.percentage}%">
        </div>

        </div>


        <p class="small">

        <b>
        Matched symptoms:
        </b>

        ${item.matched.join(", ")}

        </p>


        <p class="small">

        <b>
        Information:
        </b>

        ${item.data.info}

        </p>


        <div class="tip small">

        <b>
        💡 Health tip:
        </b>

        ${item.data.tip}

        </div>


        </div>

        `;

    });


    html+=`

    <p class="small">

    <b>
    Important:
    </b>

    These are educational symptom matches,
    not a medical diagnosis.

    </p>

    `;


    result.innerHTML=html;
}



/* =========================
   HEALTH TIPS
========================= */

function showTips(){

    const input=
    document
    .getElementById("symptoms")
    .value
    .toLowerCase();


    const symptoms=
    extractSymptoms(input);


    let tips=[];


    for(const disease in healthData){

        const data=
        healthData[disease];


        const relevant=
        symptoms.length===0 ||
        symptoms.some(
            symptom =>
            data.symptoms.includes(symptom)
        );


        if(
            relevant &&
            !tips.includes(data.tip)
        ){

            tips.push(data.tip);
        }
    }


    tips=tips.slice(0,8);


    let html=`

    <h2>
    💡 Health Tips
    </h2>

    `;


    tips.forEach(tip=>{

        html+=`

        <p class="small">
        • ${tip}
        </p>

        `;

    });


    html+=`

    <p class="small">

    These are general educational
    suggestions and are not medical advice.

    </p>

    `;


    document
    .getElementById("result")
    .innerHTML=html;
}



/* =========================
   CATEGORIES
========================= */

function showCategories(){

    let categories={};


    for(const disease in healthData){

        const category=
        healthData[disease].category;


        if(!categories[category]){
            categories[category]=[];
        }


        categories[category].push(disease);
    }


    let html=`

    <h2>
    📚 Health Categories
    </h2>

    `;


    for(const category in categories){

        html+=`

        <p class="small">

        <b>
        ${category}
        </b>

        <br>

        ${categories[category]
        .map(disease=>"• "+disease)
        .join("<br>")}

        </p>

        `;
    }


    document
    .getElementById("result")
    .innerHTML=html;
}



/* =========================
   CLEAR
========================= */

function clearApp(){

    document
    .getElementById("symptoms")
    .value="";


    document
    .getElementById("result")
    .innerHTML=`

    <h2>
    Welcome to HealthAI
    </h2>

    <p class="small">

    Enter one or more symptoms above
    to explore educational health information.

    </p>

    `;
}

</script>
